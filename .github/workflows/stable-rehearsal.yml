name: Stable promotion policy tests

on: [pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read

jobs:
  policy:
    if: github.repository == 'SkillBench-AI/skillmeter-shipping-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Confirm synthetic sandbox
        env:
          REHEARSAL_CASE: good
        run: node .github/scripts/rehearsal-fixture.cjs guard
      - name: Test copied production promotion policy
        run: node --test plugins/skillmeter/test/stable-channel.test.js
